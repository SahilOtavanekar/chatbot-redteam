[project]
name = "chatbot-redteam"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pyrit==1.1.0",
    "httpx>=0.27.2",
    "pydantic>=2.11.5",
    "python-dotenv>=1.2.2",
    "pyyaml>=6",
    "jsonpath-ng>=1.6",
    "jinja2>=3.1.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
suite = "suite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suite"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: hits a real external service"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py313"
# ruff 0.17 also formats Python code blocks inside Markdown; leave the planning docs verbatim.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
